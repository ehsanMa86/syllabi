# Run from the Actions tab: copies the latest semester into a new folder and opens a
# pull request so the university and colleges can make their updates.
name: Start a new semester

on:
  workflow_dispatch:
    inputs:
      semester:
        description: "New semester folder, e.g. 2027-fall"
        required: true
      copy_from:
        description: "Semester to copy (leave empty for the most recent)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rollover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy the semester
        env:
          SEMESTER: ${{ inputs.semester }}
          COPY_FROM: ${{ inputs.copy_from }}
        run: |
          if [ -n "$COPY_FROM" ]; then
            python scripts/new_semester.py "$SEMESTER" --from "$COPY_FROM"
          else
            python scripts/new_semester.py "$SEMESTER"
          fi
          python scripts/build.py --check

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SEMESTER: ${{ inputs.semester }}
        run: |
          branch="semester/$SEMESTER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "content/$SEMESTER"
          git commit -m "Start $SEMESTER syllabus content"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Start $SEMESTER syllabus content" \
            --body "Copied from the previous semester. The university and each college should update their files in content/$SEMESTER/ on this branch before it is merged."
